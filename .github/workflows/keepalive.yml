name: Keep Render Service Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping public health endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 \
            https://ai-xiaoguan-caqq.onrender.com/api/health
